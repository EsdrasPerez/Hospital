spring.application.name=hospital

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Hospital}
spring.datasource.username=${DB_USER:postgres}
# La contraseña de la base de datos NO tiene valor por defecto: definir la variable DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${JWT_SECRET:hospital-dev-secret-key-cambiar-en-produccion-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Credenciales del administrador inicial (DataInitializer). Configurables con las variables
# de entorno ADMIN_USER y ADMIN_PASSWORD; si no se definen se usan los valores por defecto de abajo.
# En produccion DEBE definirse ADMIN_PASSWORD.
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:Admin123*}

# Facturacion: tasa de IVA aplicada por el servidor sobre el subtotal de la factura (0.12 = 12 %).
# El subtotal sale solo de las lineas del detalle; el cliente no puede fijar subtotal, IVA ni total.
app.facturacion.iva=${FACTURACION_IVA:0.12}
